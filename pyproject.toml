[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qurator-sbb-utils"
version = "0.0.2"
authors = [
    {name = "Kai Labusch", email = "Kai.Labusch@sbb.spk-berlin.de"},
]
description = "Qurator"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.6"
keywords = ["entities", "ned", "ner"]

dynamic = ["dependencies"]

# https://pypi.org/classifiers/
classifiers = [
	'Intended Audience :: Science/Research',
	'License :: OSI Approved :: Apache Software License',
	'Programming Language :: Python :: 3',
	'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

[project.scripts]
find-entities = "qurator.utils.entities:find_entities"
csv2sqlite = "qurator.utils.csv:to_sqlite"
df2sqlite = "qurator.utils.pickle:to_sqlite"
df-concatenate = "qurator.utils.pickle:concatenate"

[project.urls]
Homepage = "https://github.com/qurator-spk/sbb_utils"
Repository = "https://github.com/qurator-spk/sbb_utils.git"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]          # or "src" if you use a src layout
include = ["qurator*"]